name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-fetch NLTK data
        run: |
          python -c "import nltk; [nltk.download(p, quiet=True) for p in ['punkt','punkt_tab','stopwords','wordnet','omw-1.4']]"

      - name: Train model (required before tests that use predict())
        run: python src/train_model.py

      - name: Run test suite
        run: pytest tests/ -v

      - name: Verify Streamlit app imports and runs without exceptions
        run: |
          python -c "
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('app.py', default_timeout=30)
          at.run()
          assert len(at.exception) == 0, at.exception
          print('App loaded with no exceptions')
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t mailguard-ai:ci .
