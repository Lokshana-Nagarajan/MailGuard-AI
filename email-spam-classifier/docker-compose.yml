services:
  mailguard-ai:
    build: .
    image: mailguard-ai:latest
    container_name: mailguard-ai
    ports:
      - "8501:8501"
    volumes:
      # Mount these from the host so the dataset/model can be updated
      # without rebuilding the image.
      - ./data:/app/data
      - ./models:/app/models
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
